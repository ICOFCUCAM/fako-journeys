name: Build the Afrinkong image library

# Download the approved photographs, encode the ladder, and commit the register.
# Here rather than in a working copy for the same reason the resolver runs here:
# the development environment cannot reach images.pexels.com at all — its proxy
# answers 403 to the CONNECT — so `fetch` is a workflow step by necessity.
#
# Nothing in this workflow decides WHICH photographs. That is decided by
# `build.py assets`, which reads and classifies without downloading, and by
# `build.py library plan`, which writes the approved set into tourism/assets.json.
# This runs against that register and nothing else.
#
# Publishing is opt-in per run and needs the four R2_ secrets. The step that
# writes first-party URLs into pages is not here at all: `rewrite` runs against
# assets that have actually been published, one at a time, because pointing a
# page at an object that was never uploaded is a broken photograph.
#
# Tick check_host_only to skip all of it and just measure the asset host: DNS,
# TLS, and every object the register says is published — type, size, cache
# header, and that an absent key 404s. Thirty seconds, no downloads.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many downloads (0 = the whole approved set)"
        required: false
        default: "25"
      publish:
        description: "Upload the ladder to R2 (needs the four R2_ secrets)"
        type: boolean
        required: false
        default: false
      encode:
        description: "Encode the AVIF/WebP ladder after downloading"
        type: boolean
        required: false
        default: true
      weigh:
        description: "Measure page weight before/after the rewrite on six of the 76 pages (needs the open internet)"
        type: boolean
        required: false
        default: false
      check_host_only:
        description: "Only check the asset host: DNS, TLS, and every published object (~30s, downloads nothing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: tourism-library
  cancel-in-progress: false

jobs:
  # THE THIRTY-SECOND ANSWER TO "IS THE LIBRARY ACTUALLY BEING SERVED".
  #
  # Whether DNS resolves, whether Cloudflare will shake hands, and whether
  # every published object comes back with the right type, size and cache
  # header are all facts about the internet and the bucket. None of them
  # needs a photograph downloaded or a file encoded: the register knows what
  # was published and at what widths, so this asks for exactly those objects.
  #
  # It used to be answerable only at the end of a five-minute pilot — download
  # twenty-five, encode three hundred, upload, and then find out. Now it is a
  # click and half a minute, which matters when the answer is "wait and try
  # again".
  host:
    if: ${{ github.event.inputs.check_host_only == 'true' && github.event.inputs.weigh != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Does the host serve every published object
        run: python tools/tourism/build.py library reachable

  # BEFORE AND AFTER, ON PAGES THAT ACTUALLY CHANGED.
  #
  # browser-checks measures four fixed pages and none of them was rewritten,
  # so it correctly reported no change and told us nothing about whether
  # first-party images are lighter than the hotlinks they replaced. This
  # loads six of the seventy-six at a phone viewport, once from the commit
  # before the rewrite and once from now, and counts the image bytes that
  # actually crossed the wire. Needs the open internet: the providers and our
  # own asset host are both unreachable from the development sandbox.
  weigh:
    if: ${{ github.event.inputs.weigh == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # "before" is a commit, so history is needed
      # LOCALLY, NOT GLOBALLY, AND THE FIRST RUN IS WHY.
      #
      # `npm i -g playwright` puts the package somewhere node's module
      # resolution will not look from a script inside the repository, so
      # weigh.js found no playwright and refused to measure — correctly, but
      # after downloading a 115 MB browser to do it. Installed here, in the
      # tree the script runs from, `require("playwright")` resolves.
      - name: Install a browser
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Weigh the rewritten pages
        run: node tools/weigh.js

  library:
    if: ${{ github.event.inputs.check_host_only != 'true' && github.event.inputs.weigh != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the encoder and the uploader
        run: python -m pip install --upgrade "pillow>=11" boto3

      # The plan is recomputed rather than trusted, so a register that has
      # drifted from the inventory cannot quietly send this to fetch something
      # the audit has since refused.
      - name: Re-plan from the inventory
        run: python tools/tourism/build.py library plan --fetch

      - name: Download the approved set
        run: |
          python tools/tourism/build.py library fetch --fetch \
            --limit "${{ github.event.inputs.limit }}"

      - name: Encode the ladder
        if: ${{ github.event.inputs.encode == 'true' }}
        run: python tools/tourism/build.py library encode --fetch

      # Cloudflare R2, S3 API. Four repository secrets, none of them ever in a
      # working copy: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
      # R2_BUCKET. Objects go up with a year of immutable caching, because a
      # name identifies one photograph at one width in one format.
      - name: Publish to R2
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python tools/tourism/build.py library publish --fetch

      # The two structural promises, before anything is uploaded: a caption
      # change cannot move an object key, and a subset can be published
      # without dragging the rest of the library live with it. Both are
      # properties that only hurt once thousands of objects exist, which is
      # exactly why they are checked on every run from now on.
      - name: The library's own invariants
        run: node tools/library-checks.js

      # Provenance only, and deliberately only that: every hosted photograph
      # has a photographer, a source page and a licence. That is a question
      # about whether the register is fit to commit, so it gates the commit.
      # The leak count is a question about pages and runs after, because run 2
      # failed here on the page-side half and discarded the download record a
      # second time.
      - name: Verify provenance
        run: python tools/tourism/build.py library provenance

      # BEFORE THE REACHABILITY GATE, AND THE FIRST REAL RUN IS WHY.
      #
      # This used to sit last. Run 1 downloaded 25 photographs, encoded 300
      # files and uploaded 325 objects — all of it true and all of it
      # recorded in the register — and then failed at the reachability check
      # because image.afrinkong.com had no public DNS yet. Because the run
      # failed, this step never ran, the register was never committed, and
      # the record of what had been downloaded and hashed was thrown away.
      # The next run would have gone back to Pexels for 25 files already
      # sitting in the bucket.
      #
      # What was downloaded is a fact about this run. Whether somebody else's
      # nameservers have propagated is not, so it does not get a vote on
      # whether the fact is written down.
      - name: Commit the register
        run: |
          git config user.name  "afrinkong-library"
          git config user.email "actions@users.noreply.github.com"
          git add tourism/assets.json data/asset-inventory.json
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "The image library: download and register the approved set"
          git push

      # An upload that returned 200 proves the S3 endpoint accepted it. It
      # does not prove image.afrinkong.com serves it to somebody with no
      # credentials, which is the only request a visitor ever makes. This asks
      # the public host for every object by the key publish used, and checks
      # the byte count, the content type, the cache header, and that an absent
      # key answers 404 rather than a 200 that is not an image.
      #
      # Last, and it still fails the run. Everything above it is durable now,
      # so failing here costs a re-run of this step alone rather than another
      # 25 downloads from a provider.
      - name: Ask the public host for what we just published
        if: ${{ github.event.inputs.publish == 'true' }}
        run: python tools/tourism/build.py library reachable

      # How far the site still is from asking a provider for nothing. Zero is
      # the target and it is a long way off — this reports the count on every
      # run so the number moves in public rather than in somebody's head.
      - name: Count what still reaches Pexels and Unsplash
        if: always()
        run: python tools/tourism/build.py library thirdparty

      # The register and the encoded ladder, not the originals. incoming/ is
      # the staging area and stays out of the repository — that is the whole
      # point of not putting several gigabytes into git. always(), because a
      # ladder that encoded correctly is worth keeping even when the host it
      # was uploaded to cannot yet be looked up.
      - name: Keep the encoded ladder as an artefact, not as a commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afrinkong-image-library
          path: images/library/
          if-no-files-found: warn
          retention-days: 14
