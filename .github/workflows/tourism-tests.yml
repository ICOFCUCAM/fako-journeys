name: Tourism system tests

# No key, no network: the suite runs the resolver against a local mock of the
# Unsplash API, so CI proves the whole path works without any secret.

on:
  push:
    paths:
      - "tools/**"
      - "tourism/**"
      - ".github/workflows/tourism-tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The suite runs tools/browser-checks.js, which measures the things that
      # can only be measured in a browser: layout shift with the images held
      # back, contrast as computed, overflow at twelve widths, the tab order,
      # the hero's composition at thirteen window shapes, and the same pages
      # again with the motion turned off. A hundred and forty-three checks.
      #
      # With no browser on the runner that script reports one failure — "no
      # headless browser available; nothing was measured" — and exits 1, which
      # is the right thing for it to do and had made this workflow red on every
      # run since the browser checks were added. Red for a reason nobody was
      # reading is the same as no signal at all.
      #
      # playwright-core is installed rather than playwright because the script
      # only ever calls chromium.launch(); the full package is here solely to
      # fetch the browser binary, and only chromium is fetched.
      - name: Give the runner a browser
        run: |
          npm install --no-save playwright-core@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Typecheck / lint
        run: |
          python3 -m py_compile tools/build_images.py tools/tourism/*.py tools/tourism/providers/*.py
          echo "ok"

      - name: Resolver test suite (against local mocks of both providers)
        env:
          # Where `playwright install` puts it on a runner. browser-checks.js
          # defaults to /opt/pw-browsers, which is this image, not that one.
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: python3 tools/tourism/build.py test

      - name: Validate every country
        run: python3 tools/tourism/build.py validate

      # RENDER IS NOT THE WHOLE BUILD, AND RUNNING IT ALONE BREAKS THIS JOB.
      #
      # `render` rebuilds the country pages from source data, which knows
      # nothing about the image library — so on its own it reverts every
      # migrated photograph to its provider and the staleness check below
      # then fails against a tree that is perfectly correct. The late passes
      # are what put the site back: rewrite first, then the rest.
      #
      # This mirrors the tail of cmd_all deliberately rather than calling
      # `all`, because `all` also regenerates 1,363 place pages and this job
      # is about the country pages it just rendered.
      - name: Rebuild pages and check the generated HTML
        run: |
          python3 tools/tourism/build.py render
          python3 tools/tourism/build.py library rewrite --fetch
          python3 tools/tourism/build.py company
          python3 tools/tourism/build.py graft
          python3 tools/tourism/build.py bound --fetch
          python3 tools/tourism/build.py srcset --fetch
          python3 tools/tourism/build.py sizeattr --fetch
          python3 tools/tourism/build.py modern --fetch
          python3 tools/tourism/build.py verify

      # THE TWO PROPERTIES THAT NO SINGLE-BUILD CHECK CAN SEE.
      #
      # Everything else here inspects one build and passes. `modern` spent
      # weeks adding a <picture> layer per run with all of it green, because
      # the damage only shows when you compare two builds. And a render
      # un-migrated a thousand photographs with all of it green, because the
      # pages were still valid — just no longer ours.
      - name: The build is idempotent, and the library is permanent
        run: |
          node tools/idempotence-checks.js
          node tools/library-permanence.js

      - name: Generated pages must be up to date with the data
        run: |
          # *.html, not tourism/ wholesale. tourism/assets.json is the image
          # register — a record of what was downloaded and wired, not a
          # generated page — and `library rewrite` restamps it whenever the
          # render it repairs actually moved a tag. That is a heartbeat, not
          # staleness, and failing the build on it teaches people to ignore
          # this check.
          if ! git diff --quiet -- 'tourism/*.html'; then
            echo "::error::tourism/*.html is stale — run 'npm run tourism:all' and commit the result"
            git --no-pager diff --stat -- tourism/
            exit 1
          fi
          echo "generated pages match the data"
