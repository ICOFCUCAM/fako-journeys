name: Resolve tourism images

# Run the resolver where there is actually internet access, with the keys held as
# repository secrets so neither touches a working copy or a commit.
#
# Setup, once — Settings -> Secrets and variables -> Actions -> New repository secret:
#   UNSPLASH_ACCESS_KEY   your Unsplash *Access Key* (never the Secret key)
#   PEXELS_API_KEY        your Pexels API key       (optional; the fallback)
#
# Either alone is enough. With both, Unsplash is tried first and Pexels fills
# what it cannot. Then: Actions -> Resolve tourism images -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Limit to one provider (blank = Unsplash then Pexels)"
        type: choice
        required: false
        default: ""
        options: ["", "unsplash", "pexels"]
      country:
        description: "Country slug, or blank for every country"
        required: false
        default: ""
      category:
        description: "Category id, or blank for all 27"
        required: false
        default: ""
      force:
        description: "Re-resolve slots that are already cached"
        type: boolean
        required: false
        default: false
      commit:
        description: "Commit the cache and regenerated pages back to this branch"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: tourism-resolve-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check at least one provider key is configured
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$UNSPLASH_ACCESS_KEY" ] && [ -z "$PEXELS_API_KEY" ]; then
            echo "::error::Tourism image resolution requires UNSPLASH_ACCESS_KEY or PEXELS_API_KEY."
            echo "Add one under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          [ -n "$UNSPLASH_ACCESS_KEY" ] && echo "unsplash key present (value never printed)"
          [ -n "$PEXELS_API_KEY" ] && echo "pexels key present (value never printed)"
          exit 0

      - name: Resolve images (Unsplash, then Pexels)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.country }}" ]  && ARGS="$ARGS --country ${{ inputs.country }}"
          [ -n "${{ inputs.category }}" ] && ARGS="$ARGS --category ${{ inputs.category }}"
          [ -n "${{ inputs.provider }}" ] && ARGS="$ARGS --provider ${{ inputs.provider }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          echo "resolve$ARGS"
          # A partial run is a success: failed slots keep their placeholder and the
          # cache still holds everything that did resolve, so a re-run continues.
          python3 tools/tourism/build.py resolve $ARGS || true

      - name: Rebuild pages and validate
        run: |
          # `all` runs validate, render, homes, gateway, verify and report — the
          # country pages and the gateway read their pictures from the same cache
          # the resolver just filled, so both have to be rewritten here or the
          # run fills the cache and every page still shows what it showed before.
          python3 tools/tourism/build.py all

      - name: Per-slot status
        run: |
          python3 tools/tourism/build.py status

      - name: Country x provider report
        run: |
          python3 tools/tourism/build.py providers

      - name: Confirm no key leaked into any artifact
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          for KEY in "$UNSPLASH_ACCESS_KEY" "$PEXELS_API_KEY"; do
            if [ -n "$KEY" ] && grep -rlF "$KEY" --exclude-dir=.git . ; then
              echo "::error::an API key appears in a file — refusing to commit"
              exit 1
            fi
          done
          echo "no key material in the working tree"

      - name: Commit the cache and regenerated pages
        if: ${{ inputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Everything the build wrote, not a list of paths that was complete on
          # the day it was typed. The list above was: it named the cache, the
          # report, the /tourism pages and the root pages — which was every
          # generated file when it was written and is now about a tenth of them.
          # Measured rather than asserted: planting three resolved slots for
          # Kenya and running `build.py all` changes ten files, and seven of
          # them are outside the old list — three place pages, the portrait, and
          # data/atlas/kenya.json, data/meet.json and data/stories.json, which
          # are what the atlas, the human layer and the reading room actually
          # read. So a run resolving two hundred slots would have committed the
          # cache and the country pages while leaving the atlas, the journey
          # engine, /meet, /stories and two hundred place pages still drawing
          # plates for photographs that had already been found and paid for.
          #
          # `git add -A` is safe here specifically because the step above has
          # already grepped the whole working tree for both keys and failed the
          # run if either appeared. .gitignore keeps the contact sheet out.
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — every requested slot was already cached"
          else
            RESOLVED=$(python3 -c "import json;print(len(json.load(open('tourism/cache/images.json'))['entries']))")
            git commit -m "Resolve tourism images ($RESOLVED cached)" \
                       -m "Ran tools/tourism/build.py resolve on a runner with network access. Every URL in the cache came from an Unsplash or Pexels search response and was fetched over HTTP before being stored."
            git push
          fi

      - name: Upload the cache as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-cache
          path: |
            tourism/cache/images.json
            tourism/REPORT.md
