name: Resolve tourism images

# Run the resolver where there is actually internet access, with the keys held as
# repository secrets so neither touches a working copy or a commit.
#
# Setup, once — Settings -> Secrets and variables -> Actions -> New repository secret:
#   UNSPLASH_ACCESS_KEY   your Unsplash *Access Key* (never the Secret key)
#   PEXELS_API_KEY        your Pexels API key       (optional; the fallback)
#
# Either alone is enough. With both, Unsplash is tried first and Pexels fills
# what it cannot. Then: Actions -> Resolve tourism images -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Limit to one provider (blank = Unsplash then Pexels)"
        type: choice
        required: false
        default: ""
        options: ["", "unsplash", "pexels"]
      country:
        description: "Country slug, or blank for every country"
        required: false
        default: ""
      category:
        description: "Category id, or blank for all 27"
        required: false
        default: ""
      force:
        description: "Re-resolve slots that are already cached"
        type: boolean
        required: false
        default: false
      commit:
        description: "Commit the cache and regenerated pages back to this branch"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: tourism-resolve-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check at least one provider key is configured
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$UNSPLASH_ACCESS_KEY" ] && [ -z "$PEXELS_API_KEY" ]; then
            echo "::error::Tourism image resolution requires UNSPLASH_ACCESS_KEY or PEXELS_API_KEY."
            echo "Add one under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          [ -n "$UNSPLASH_ACCESS_KEY" ] && echo "unsplash key present (value never printed)"
          [ -n "$PEXELS_API_KEY" ] && echo "pexels key present (value never printed)"
          exit 0

      - name: Resolve images (Unsplash, then Pexels)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.country }}" ]  && ARGS="$ARGS --country ${{ inputs.country }}"
          [ -n "${{ inputs.category }}" ] && ARGS="$ARGS --category ${{ inputs.category }}"
          [ -n "${{ inputs.provider }}" ] && ARGS="$ARGS --provider ${{ inputs.provider }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          echo "resolve$ARGS"
          # A PARTIAL RUN IS A SUCCESS. A CRASHED RUN IS NOT.
          #
          # This was `|| true`, and the reasoning was sound for the case it was
          # written for: a slot whose search returns nothing keeps its
          # placeholder, the cache keeps what did resolve, and a re-run
          # continues. That is a partial success and should not fail the job.
          #
          # But `|| true` cannot tell a slot failure from the resolver dying.
          # An ImportError on the first uncached slot exited non-zero, was
          # swallowed here, and every step after it ran on a cache that had not
          # been touched — so the job rebuilt pages, printed
          # "OK: 54 · UNRESOLVED: 540", committed, and reported green. A green
          # check on a run that resolved nothing is worse than a red one,
          # because nobody goes looking.
          #
          # The resolver handles per-slot failure itself and exits 0 when it
          # finishes with slots unfilled. Anything non-zero from here is the
          # process failing, and it stops the job.
          # Published AND quarantined. The audit step below moves records from
          # one to the other, so counting only the published ones would read a
          # healthy run that rejected more than it found as a shrinking cache.
          CACHED_BEFORE=$(python3 -c "import json;d=json.load(open('tourism/cache/images.json'));print(len(d['entries'])+len(d.get('rejected') or {}))" 2>/dev/null || echo 0)
          echo "CACHED_BEFORE=$CACHED_BEFORE" >> "$GITHUB_ENV"
          # RECORD THE EXIT, DO NOT ACT ON IT YET.
          #
          # 165 removed a `|| true` here because it swallowed a crash and the run
          # went green having resolved nothing. That was right, and it was not
          # enough: failing at this step means every step after it is skipped —
          # including the commit — so run #24 spent three minutes and fifty
          # seconds resolving real slots and then threw all of it away.
          #
          # Partial progress is the normal case for this job. Providers
          # rate-limit, and a run that fills two hundred slots and stops is worth
          # keeping; the resolver is built to resume from the cache precisely so
          # that it can be run again. So the exit is recorded here, the cache is
          # rebuilt, verified and committed as usual, and the job fails at the
          # very end. Red check, and the work is still in the repository.
          set +e
          python3 tools/tourism/build.py resolve $ARGS
          echo "RESOLVE_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Quarantine what the resolver should not have taken
        run: |
          # THE RESOLVER DECIDES WHAT TO FETCH. THE AUDIT DECIDES WHAT TO KEEP.
          #
          # This step did not exist, and the gap it left is not theoretical: the
          # run that filled Sierra Leone, Somalia, South Sudan, Sudan and Togo
          # committed a woman in a crochet dress as the Wome waterfall, men with
          # mud on their bodies as the forested Kloto hills, and "beach on
          # seashore" as the city of Lome. Twenty-two of a hundred and nineteen.
          # The resolver's own score let them through because a score computed
          # from a search query cannot see what the photograph turned out to be;
          # the audit reads the provider's own description out of the sourceUrl
          # and compares it with what the page claims, which can.
          #
          # It also closes the hole that made the last merge dangerous. The
          # quarantine lives in the cache as `rejected`, and Cache.photo_ids()
          # counts those ids as spent so they are never fetched twice — but only
          # for a run that starts from a cache that already has them. Dispatched
          # on a ref without the quarantine, the resolver re-adopted all 315
          # previously rejected photographs, byte-identical, and nothing in the
          # diff looked wrong. Auditing here makes that impossible to ship
          # whichever ref the run starts from: the same photographs fail the
          # same checks again and are quarantined again before anything renders.
          #
          # Before `all`, deliberately. The audit reads the cache and the
          # taxonomy and needs no rendered page, so quarantining first means the
          # dropped slots are never rendered, never committed, and fall back to
          # the country plate in the same pass. --force is what writes; without
          # it this only prints.
          #
          # And this one is allowed to fail the job. The steps above record their
          # exit rather than raising because a partial resolve is still worth
          # committing. That reasoning does not carry here: if the audit cannot
          # run, the alternative is committing photographs nobody has checked,
          # which is the exact outcome this step exists to prevent. Better to
          # lose the run.
          python3 tools/tourism/build.py audit --force

      - name: Move the hard crops off dead centre
        run: |
          # A HUNDRED AND SIXTY-EIGHT SLOTS CROPPED AT 50,50.
          #
          # validate.py has warned about this for as long as it has existed:
          # hero, panoramic and portrait boxes throw away most of the frame, and
          # fifty per cent is not a decision about a photograph, it is the
          # absence of one — in a tall portrait box it is the setting most
          # likely to take the top off whatever the picture is of.
          #
          # It runs HERE and not on a developer's machine because it has to read
          # the photographs, and they live on the providers' CDNs. The
          # environment this was written in denies images.pexels.com outright,
          # so the pass reports "could not be read" for every slot and does
          # nothing. This runner has the same network access the resolver needs
          # and is the only place the work can happen.
          #
          # After the audit, so a photograph about to be quarantined is not
          # measured first; before `all`, so the pages render with the crops the
          # step just chose. Only slots still sitting on dead centre are
          # touched, so anything set by hand survives every run.
          #
          # What it cannot do is see. There is no face detector here: it finds
          # where the DETAIL is, damps that 55% back towards the middle, clamps
          # it inside 30-70 and declines to write a shift smaller than five
          # points. See tools/tourism/focal.py.
          pip install --quiet Pillow
          python3 tools/tourism/build.py focal --fetch

      - name: Rebuild pages and validate
        run: |
          # `all` runs validate, render, homes, gateway, verify and report — the
          # country pages and the gateway read their pictures from the same cache
          # the resolver just filled, so both have to be rewritten here or the
          # run fills the cache and every page still shows what it showed before.
          python3 tools/tourism/build.py all

      - name: Verify the resolution actually happened
        run: |
          # Records rather than fails, for the same reason the resolve step does:
          # a step that exits non-zero here skips the commit below it, and the
          # whole point is that whatever resolved reaches the repository. The
          # final step acts on both verdicts.
          set +e
          python3 tools/verify_resolution.py "${CACHED_BEFORE:-0}"
          echo "VERIFY_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Per-slot status
        run: |
          python3 tools/tourism/build.py status

      - name: Country x provider report
        run: |
          python3 tools/tourism/build.py providers

      - name: Confirm no key leaked into any artifact
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          for KEY in "$UNSPLASH_ACCESS_KEY" "$PEXELS_API_KEY"; do
            if [ -n "$KEY" ] && grep -rlF "$KEY" --exclude-dir=.git . ; then
              echo "::error::an API key appears in a file — refusing to commit"
              exit 1
            fi
          done
          echo "no key material in the working tree"

      - name: Commit the cache and regenerated pages
        if: ${{ inputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Everything the build wrote, not a list of paths that was complete on
          # the day it was typed. The list above was: it named the cache, the
          # report, the /tourism pages and the root pages — which was every
          # generated file when it was written and is now about a tenth of them.
          # Measured rather than asserted: planting three resolved slots for
          # Kenya and running `build.py all` changes ten files, and seven of
          # them are outside the old list — three place pages, the portrait, and
          # data/atlas/kenya.json, data/meet.json and data/stories.json, which
          # are what the atlas, the human layer and the reading room actually
          # read. So a run resolving two hundred slots would have committed the
          # cache and the country pages while leaving the atlas, the journey
          # engine, /meet, /stories and two hundred place pages still drawing
          # plates for photographs that had already been found and paid for.
          #
          # `git add -A` is safe here specifically because the step above has
          # already grepped the whole working tree for both keys and failed the
          # run if either appeared. .gitignore keeps the contact sheet out.
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — every requested slot was already cached"
          else
            RESOLVED=$(python3 -c "import json;print(len(json.load(open('tourism/cache/images.json'))['entries']))")
            git commit -m "Resolve tourism images ($RESOLVED cached)" \
                       -m "Ran tools/tourism/build.py resolve on a runner with network access. Every URL in the cache came from an Unsplash or Pexels search response and was fetched over HTTP before being stored."
            git push
          fi

      - name: Upload the cache as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-cache
          path: |
            tourism/cache/images.json
            tourism/REPORT.md

      - name: The resolver's own exit decides the job
        run: |
          # Last step, so everything above it has already run and committed.
          # A non-zero resolver is a failed run even when some slots filled:
          # the point of 165 is that this job never reports success for a
          # process that died. It reports success for a partial run that
          # finished, and red for one that did not.
          BAD=0
          if [ "${RESOLVE_EXIT:-0}" != "0" ]; then
            echo "::error::the resolver exited ${RESOLVE_EXIT} — whatever it managed to resolve has been committed, so re-running continues from there"
            BAD=1
          fi
          if [ "${VERIFY_EXIT:-0}" != "0" ]; then
            echo "::error::verification failed; see the table in the verify step"
            BAD=1
          fi
          [ "$BAD" = "0" ] && echo "the resolver finished cleanly and the cache verifies"
          exit "$BAD"
